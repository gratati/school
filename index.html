<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лицей №9 — Система</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --board-dark:#101a15;
  --chalk:#fff;
  --gold:#f2af3f;
}

/* базовый стиль */
html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Manrope,sans-serif;
  background:var(--board-dark);
  color:var(--chalk);
  overflow-x:hidden;
}

/* =======================
   FIX: BACKGROUND SYSTEM
======================= */
#bg, #bg2{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  transform:translateZ(0);
}

#bg{ z-index:1; }
#bg2{
  z-index:2;
  opacity:0;
  transition:opacity .6s ease;
}

/* UI layers */
#bgAccent{position:fixed;inset:0;z-index:3;opacity:.3}
#schoolFX{position:fixed;inset:0;z-index:4;pointer-events:none}

/* screens */
.screen{display:none;position:relative;z-index:10}
.active{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}

/* buttons */
button{
  padding:14px 24px;
  border-radius:999px;
  border:none;
  cursor:pointer;
}

/* =======================
   FIXED VIDEO MODAL
======================= */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
}
.modal-overlay.active{display:flex}

.custom-player{
  width:90%;
  max-width:900px;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

video{
  width:100%;
  display:block;
}

/* controls simplified */
.player-controls{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px;
  background:#111;
  color:#fff;
}

</style>
</head>

<body>

<!-- BACKGROUNDS -->
<div id="bg"></div>

<!-- UI -->
<div id="bgAccent"></div>
<div id="schoolFX"></div>

<!-- SCREENS -->
<div id="start" class="screen active">
  <button onclick="start()">Войти</button>
</div>

<div id="characters" class="screen">
  <button onclick="goGame()">Дальше</button>
</div>

<div id="game" class="screen">
  <h2>Игра</h2>
</div>

<div id="result" class="screen">
  <button onclick="finale()">Финал</button>
</div>

<div id="final" class="screen">
  <button onclick="openGift()">Видео</button>
</div>

<!-- MODAL -->
<div id="giftModal" class="modal-overlay">
  <div class="custom-player">
    <video id="video" controls></video>
  </div>
</div>

<script>

/* =======================
   SCENES (твой массив сохраняется)
======================= */
const scenes = [
  { bg:"img/start.jpg" },
  { bg:"img/class.jpg" },
  { bg:"img/hall.jpg" },
  { bg:"img/library.jpg" }
];

/* =======================
   BACKGROUND ENGINE FIX
======================= */
const bg = document.getElementById("bg");
const bg2 = document.createElement("div");
bg2.id = "bg2";
document.body.appendChild(bg2);

let toggle = false;
const cache = {};

function preload(src){
  const img = new Image();
  img.src = src;
  cache[src] = img;
}

/* preload ВСЕ фоны */
scenes.forEach(s => preload(s.bg));
preload("img/start.jpg");

function setBgImage(path){

  const target = toggle ? bg : bg2;
  const prev = toggle ? bg2 : bg;

  const apply = () => {
    target.style.backgroundImage = `url('${path}')`;
    target.style.opacity = 1;
    prev.style.opacity = 0;
    toggle = !toggle;
  };

  if(cache[path]?.complete){
    apply();
  } else {
    const img = new Image();
    img.onload = apply;
    img.src = path;
  }
}

/* =======================
   NAVIGATION
======================= */
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* =======================
   FLOW
======================= */
function start(){
  show("characters");
  setBgImage("img/choose.jpg");
}

function goGame(){
  show("game");
  setBgImage(scenes[1].bg);
}

function finale(){
  show("final");
  setBgImage("img/hall.jpg");
}

/* =======================
   VIDEO FIX (LOCAL + YANDEX SAFE)
======================= */
const video = document.getElementById("video");

function openGift(){
  document.getElementById("giftModal").classList.add("active");

  // безопасный источник (локальный как основной)
  video.src = "video/slideshow.mp4";

  video.load();
  video.play().catch(()=>{});
}

document.getElementById("giftModal").onclick = (e)=>{
  if(e.target.id === "giftModal"){
    document.getElementById("giftModal").classList.remove("active");
    video.pause();
  }
};

</script>

</body>
</html>
