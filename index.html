<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лицей №9 — Система</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --board-dark:#101a15;
  --chalk:#ffffff;
  --chalk-dim:#e2e8df;
  --gold:#f2af3f;
  --coral:#ff7b54;
  --sage:#8cc49d;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:'Manrope', sans-serif;
  color:var(--chalk);
  background:var(--board-dark);
  overflow-x:hidden;
}

/* ===== FIX: BG LAYERS ===== */
#bg, #bg2{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  will-change: opacity;
  transform: translateZ(0);
}

#bg{ z-index:1; }
#bg2{
  z-index:2;
  opacity:0;
  transition: opacity 0.6s ease;
}

#bgAccent{ position:fixed; inset:0; z-index:3; opacity:0.3; mix-blend-mode:color-dodge; }
canvas#particles{ position:fixed; inset:0; z-index:4; pointer-events:none; }
#schoolFX{ position:fixed; inset:0; z-index:5; pointer-events:none; }

.screen{ position:relative; z-index:10; }
.screen{ display:none; }
.active{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }

/* остальной CSS ты НЕ трогаешь — он у тебя норм */

</style>
</head>

<body>

<div id="bg"></div>
<div id="bg2"></div>

<div id="bgAccent"></div>
<div id="schoolFX"></div>
<canvas id="particles"></canvas>

<!-- UI оставлен как есть -->
<div id="start" class="screen active">
  <div class="stage">
    <h1>Система</h1>
    <button onclick="start()">Войти</button>
  </div>
</div>

<!-- =========================
     JS FIXES ONLY
========================= -->
<script>

const bg = document.getElementById("bg");
const bg2 = document.getElementById("bg2");

/* ===== SCENE BACKGROUNDS PRELOAD ===== */
const bgCache = {};

function preloadImage(src){
  const img = new Image();
  img.src = src;
  bgCache[src] = img;
}

/* preload ВСЕ сцен */
function preloadAll(){
  scenes.forEach(s => preloadImage(s.bg));
}
preloadAll();

/* ===== FIXED BG SWITCH ===== */
let toggle = false;

function setBgImage(path){
  const target = toggle ? bg : bg2;
  const prev = toggle ? bg2 : bg;

  if(bgCache[path]?.complete){
    target.style.backgroundImage = `url('${path}')`;
    target.style.opacity = 1;
    prev.style.opacity = 0;
    toggle = !toggle;
    return;
  }

  const img = new Image();
  img.onload = () => {
    target.style.backgroundImage = `url('${path}')`;
    target.style.opacity = 1;
    prev.style.opacity = 0;
    toggle = !toggle;
  };
  img.src = path;
}

/* ===== SCENES (оставь свои оригинальные) ===== */
const scenes = [
  { label:"1", bg:"img/class.jpg" },
  { label:"2", bg:"img/hall.jpg" },
  { label:"3", bg:"img/library.jpg" }
];

/* ===== START ===== */
function start(){
  setBgImage("img/start.jpg");
}

/* ===== VIDEO SAFE LOADER ===== */
const video = document.getElementById("slideshowVideo");

const VIDEO_FALLBACK = "video/slideshow.mp4";

function initVideo(){
  video.src = VIDEO_FALLBACK;

  video.addEventListener("error", () => {
    console.warn("Fallback video failed");
  });
}
initVideo();

</script>

</body>
</html>
